name: nixpkgs compatibility

# Checks that container evaluation still works against each supported nixpkgs branch.
# Runs weekly so that breaking changes in nixos-unstable are noticed within days
# rather than when a user reports them. Dates of failures and fixes feed the
# compatibility table in the README.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - eval-config.nix
      - flake.nix
      - flake.lock
      - util/test-containers.nix
      - examples/**
      - justfile
      - .github/workflows/compat.yml

jobs:
  evaluate:
    name: evaluate (${{ matrix.nixpkgs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nixpkgs:
          - nixos-26.05
          - nixos-25.11
          - nixos-unstable
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Compatibility checks (evaluation only)
        run: nix develop -c just compatWith ${{ matrix.nixpkgs }}

  vm-test:
    # The full VM test on the branch most likely to break. Only on the weekly run and
    # manual triggers, since it builds a NixOS VM.
    name: vm test (${{ matrix.nixpkgs }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nixpkgs:
          - nixos-26.05
          - nixos-unstable
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and run the VM test
        run: nix develop -c just vmTestWith ${{ matrix.nixpkgs }}
