name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Flake check (evaluate only)
        run: nix flake check --no-build
      - name: nixfmt
        run: nix run nixpkgs#nixfmt -- --check flake.nix default.nix eval-config.nix examples/*/*.nix
      - name: shellcheck
        run: nix run nixpkgs#shellcheck -- extra-container test.sh run-tests-in-container.sh util/install.sh util/test-readme.sh examples/flake/usage.sh
      - name: Utility tests
        run: nix shell nixpkgs#python3 -c python3 -B util/test_utilities.py
      - name: Examples evaluate against this checkout
        run: |
          for e in flake agent vpn; do
            PROJECT_ROOT=/tmp CONTAINER_SSH_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA ci" \
              nix eval --impure --override-input extra-container . "./examples/$e#packages.x86_64-linux.default.drvPath"
          done
